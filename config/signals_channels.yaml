# X List 交易信号 → Cards API 推送 + 博主回溯（合一配置）
#
# key = X handle（不含 @，大小写不敏感）
# - channelId / channelName / channelAvatar：推送 Cards 用（channelId 空则走 default_channel）
# - name / aliases / enabled / profile_url / notes：博主回溯用（enabled=false 不出现在名单）
# profile 默认 https://x.com/{key}

cards_api:
  enabled: true
  base_url: "http://127.0.0.1:3851"
  path: "/api/v1/cards"
  api_key: "1dd372b918ddae5188a9a781680"  # 默认密钥；环境变量 CARDS_API_KEY 可覆盖
  # 来源后缀，请求体 source = python-ai-operate:<后缀>，列表信号默认 x
  source: "x"
  # 仅推送 AI 判定为交易信号的卡片
  only_trade_signals: true
  # 写入 Discord 时间线；单卡可覆盖
  inject_channel_message: true
  timeout_sec: 15

# 无映射时的默认频道
default_channel:
  channelId: "api"
  channelName: "未映射"
  channelAvatar: ""

