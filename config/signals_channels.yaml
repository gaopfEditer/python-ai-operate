# X List 交易信号 → Cards API 推送配置
#
# 推特用户名（不含 @，大小写不敏感）→ 频道 ID + 展示名。
# 产生交易信号后 POST 到 cards_api；已推送的 tweet_id 不会重复发。

cards_api:
  enabled: true
  base_url: "http://127.0.0.1:3851"
  path: "/api/v1/cards"
  api_key: "1dd372b918ddae5188a9a781680"  # 也可用环境变量 CARDS_API_KEY 覆盖
  # 来源后缀，请求体 source = python-ai-operate:<后缀>，列表信号默认 x
  source: "x"
  # 仅推送 AI 判定为交易信号的卡片
  only_trade_signals: true
  # 写入 Discord 时间线；单卡可覆盖
  inject_channel_message: true
  timeout_sec: 15

# 无映射时的默认频道
default_channel:
  channelId: "api"
  channelName: "未映射推特源"
  channelAvatar: ""

# 推特 handle → 频道
# key 建议小写；CryptoDanta / @CryptoDanta 均可匹配
channels:
  cryptodanta:
    channelId: "88888886666661"
    channelName: "蛋挞"
    channelAvatar: ""
  thankucrypto:
    channelId: "444962489551814726"
    channelName: "熬鹰"
    channelAvatar: ""
